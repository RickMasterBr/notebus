appId: com.rickmasterbr.notebus
---
# M-3 (T-94): "Está indo ou voltando?" sem rede
# Do ponto, tocar na viagem abre a TL-05 (Daqui para a frente) e a lista mostra as paragens que faltam.

- launchApp:
    clearState: true

# Espera o app abrir e a folha assentar antes do primeiro toque
- extendedWaitUntil:
    visible:
      text: "Registrar.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000

# Sobe a folha da Início para revelar o cartão Arrabalde abaixo da dobra
- swipe:
    start: 50%, 65%
    end: 50%, 20%
- extendedWaitUntil:
    visible:
      text: "Arrabalde.*"
    timeout: 8000

# Abre o ponto Arrabalde a partir dos recentes
- tapOn:
    text: "Arrabalde.*"

# Confere a tela do ponto aberta
- assertVisible:
    text: "Arrabalde.*"

# A folha do ponto abre pequena: sobe a folha para a linha de passagem aparecer
- swipe:
    start: 50%, 68%
    end: 50%, 20%
- extendedWaitUntil:
    visible:
      text: "Linha 1, para Casa, .*"
    timeout: 8000
- tapOn:
    text: "Linha 1, para Casa, .*"

# Confere a TL-05 aberta
- assertVisible:
    text: "Daqui para a frente"

# Confere que a lista mostra as paragens que faltam
- assertVisible:
    text: ".*Facul.*"

- assertVisible:
    text: ".*Casa.*"
