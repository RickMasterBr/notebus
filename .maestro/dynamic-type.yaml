appId: com.rickmasterbr.notebus
---
# T-95: Dynamic Type em 5 telas principais
# 1. Início
# 2. TL-02 Ponto (Arrabalde)
# 3. TL-05 Daqui para a frente
# 4. TL-03 Registrar
# 5. TL-04 Ir para X (Facul)
# Tira uma captura de cada tela e confere que "no ponto às" e "sair às" estão visíveis inteiros.

- launchApp:
    clearState: false

# 1. Tela Inicial
- assertVisible:
    text: "Registrar.*"
- takeScreenshot: "01-inicio"

# Sobe a folha da Início para revelar o cartão Arrabalde abaixo da dobra
- swipe:
    start: 50%, 65%
    end: 50%, 20%
- extendedWaitUntil:
    visible:
      text: "Arrabalde.*"
    timeout: 8000

# 2. TL-02 Ponto (Arrabalde)
- tapOn:
    text: "Arrabalde.*"
- assertVisible:
    text: "Arrabalde.*"
# Confere "no ponto às" inteiro (rótulo da hora do ônibus na folha do ponto, `home.stop_card.eta_label`)
- assertVisible:
    text: ".*no ponto às.*"
- takeScreenshot: "02-ponto"

# 3. TL-05 Daqui para a frente
- tapOn:
    text: ".*Linha 1.*"
- assertVisible:
    text: "Daqui para a frente"
- takeScreenshot: "03-daqui-para-a-frente"
# Fecha Daqui para a frente
- tapOn:
    text: "Fechar"
# Fecha Ponto
- tapOn:
    text: "Fechar"

# 4. TL-03 Registrar
- tapOn:
    text: "Registrar.*"
- assertVisible:
    text: ".*Linha 1.*"
- takeScreenshot: "04-registrar"
# Fecha Registrar
- tapOn:
    text: "Fechar"

# 5. TL-04 Ir para (Facul)
- tapOn:
    text: "Facul"
- assertVisible:
    text: ".*Ir para Facul.*"
# Confere "sair às" visível por inteiro
- assertVisible:
    text: ".*sair às.*"
- takeScreenshot: "05-ir-para"
# Fecha Ir para
- tapOn:
    text: "Fechar"
