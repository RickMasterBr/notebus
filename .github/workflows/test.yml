name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Esquema e migrações não podem divergir: gerar de novo não pode mudar nada.
      - run: npm run db:generate -w @notebus/mobile && git diff --exit-code && test -z "$(git status --porcelain)"
